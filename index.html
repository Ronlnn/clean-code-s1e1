<!DOCTYPE html>
<html>
  <head>
    <title>
	  Todo App
    </title>
    <link
	href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet"
	>
    <link
	rel="stylesheet"
	href="style.css"
	media="screen"
	charset="utf-8"
	>
  </head>
  <body class="page">
    <div class="matrix">
	  <img src="./eisenhower-matrix.jpg">
	  <a
	  class="more-inf"
	  href="https://goal-life.com/page/method/matrix-eisenhower"
	  >
		Want more details?
	  </a>
	</div>
    <div class="main">
	  <p id="add-section">
	    <label for="new-task" class="list-title">Add Item</label>
		<div class="task-wrapper">
		  <input
		  id="new-task"
		  class="task-input"
		  type="text"
		  >
		  <button class="button" id="btn-add">Add</button>
		</div>
      </p>
      <h3 class="list-title">Todo</h3>
      <ul id="todo-list" class="task-list">
        <li class="task-item">
		  <input type="checkbox" class="checkbox">
		  <label class="item-label" >Pay Bills</label>
		  <input type="text" class="task-input">
		  <button class="button edit" id="edit">Edit</button>
		  <button class="button delete" id="delete">
			<img src="./remove.svg" class="btn-img">
		  </button>
		</li>
        <li class="task-item edit-mode">
		  <input type="checkbox" class="checkbox">
		  <label class="item-label">Go Shopping</label>
		  <input
		  type="text"
		  value="Go Shopping"
		  class="task-input"
		  >
		  <button class="button edit" id="edit">Save</button>
		  <button class="button delete" id="delete">
			<img src="./remove.svg" class="btn-img">
		  </button>
		</li>
      </ul>
      <h3 class="list-title">Completed</h3>
	  <ul id="done-list" class="task-list">
		<li class="task-item">
		  <input type="checkbox" class="checkbox" checked>
		  <label class="item-label">See the Doctor</label>
		  <input type="text" class="task-input">
		  <button class="button edit" id="edit">Edit</button>
		  <button class="button delete" id="delete">
			<img src="./remove.svg" class="btn-img">
	      </button>
		</li>
	  </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
